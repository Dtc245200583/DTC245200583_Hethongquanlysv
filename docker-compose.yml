# Student Management System — DTC245200583 Nguyễn Thị Quế
# Khởi chạy: docker compose up -d --build
name: sms

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  # ---------------------------------------------------------------- Ứng dụng
  app:
    <<: *hardening
    build: .
    image: sms-app:1.0
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    cap_drop: [ALL]
    depends_on:
      mysql:
        condition: service_healthy
    networks: [backend]

  nginx:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./public:/var/www/html/public:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/stub_status"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      app:
        condition: service_healthy
    networks: [frontend, backend, monitoring]

  mysql:
    <<: *hardening
    image: mysql:8.4.2
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    secrets: [mysql_root_password]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    # Không publish cổng 3306 ra ngoài: chỉ truy cập trong mạng backend.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [backend]

  phpmyadmin:
    <<: *hardening
    image: phpmyadmin:5.2.1
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 16M
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [frontend, backend]

  # ---------------------------------------------------------------- Giám sát
  prometheus:
    <<: *hardening
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [frontend, monitoring]

  grafana:
    <<: *hardening
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on: [prometheus, loki]
    networks: [frontend, monitoring]

  cadvisor:
    <<: *hardening
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [monitoring]

  mysql-exporter:
    <<: *hardening
    image: prom/mysqld-exporter:v0.15.1
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
    cap_drop: [ALL]
    depends_on:
      mysql:
        condition: service_healthy
    networks: [backend, monitoring]

  nginx-exporter:
    <<: *hardening
    image: nginx/nginx-prometheus-exporter:1.3.0
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    cap_drop: [ALL]
    depends_on: [nginx]
    networks: [monitoring]

  # ---------------------------------------------------------------- Logging
  loki:
    <<: *hardening
    image: grafana/loki:3.1.1
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks: [monitoring]

  promtail:
    <<: *hardening
    image: grafana/promtail:3.1.1
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [monitoring]

networks:
  # Mạng có cổng publish ra máy host.
  frontend:
  # internal: không có đường ra Internet, chỉ các container trong mạng nói chuyện với nhau.
  backend:
    internal: true
  monitoring:
    internal: true

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
