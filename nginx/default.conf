# Nginx reverse proxy cho Laravel (PHP-FPM).
# Image nginx-unprivileged chạy bằng user nginx (uid 101) nên lắng nghe cổng > 1024:
#   8080 = HTTP (chuyển hướng), 8443 = HTTPS, 8081 = stub_status nội bộ cho exporter.

server_tokens off;

# Log JSON để Loki/LogQL tách trường bằng "| json".
log_format json_combined escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"referer":"$http_referer","user_agent":"$http_user_agent"}';

limit_req_zone $binary_remote_addr zone=req_limit:10m rate=20r/s;
limit_req_status 429;

upstream laravel {
    server app:9000;
}

server {
    listen 8080;
    server_name _;
    access_log /dev/stdout json_combined;

    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/html/public;
    client_max_body_size 2m;
    access_log /dev/stdout json_combined;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' https://cdn.jsdelivr.net; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;

    # Chặn file ẩn (.env, .git, ...)
    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        limit_req zone=req_limit burst=40 nodelay;
        try_files $uri @laravel;
    }

    # Mọi request không phải file tĩnh được chuyển cho public/index.php trong container app.
    location @laravel {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        fastcgi_pass laravel;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }
}

# Endpoint metrics nội bộ — không publish ra host, chỉ cho phép mạng Docker.
server {
    listen 8081;
    access_log off;

    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}
